name: Extract submission
on:
  push:
    paths:
      - DataBase-source.zip
permissions:
  contents: write
jobs:
  extract:
    if: github.event.head_commit.message != 'Extract project files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit project
        run: |
          set -e
          mkdir -p /tmp/submission
          unzip -q DataBase-source.zip -d /tmp/submission
          cp -R "/tmp/submission/MongoForm-第一阶段提交/." .
          rm -f DataBase-source.zip
          rm -f .github/workflows/extract-submission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract project files"
          git push origin HEAD:homework01
